name: "APK · NexoBot"

on:
  push:
    branches: [main]
    paths: ["NexoBot/**", ".github/workflows/nexo-bot-apk.yml"]
  pull_request:
    paths: ["NexoBot/**", ".github/workflows/nexo-bot-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK debug
        run: gradle -p NexoBot assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NexoBot-debug-apk
          path: NexoBot/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
